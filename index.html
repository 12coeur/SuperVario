<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Vario</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body id="appBody">

  <header id="mainHeader">
    <div class="header-left"></div>

    <div class="header-center">
      <button class="hamburger-btn" id="btnHamburger"
              aria-label="Afficher ou masquer les réglages"
              title="Afficher ou masquer les réglages">
        <img src="Images/param.png" alt="Paramètres">
      </button>
      <div class="header-title" id="headerTitle">
        <h2>Super <span class="sub-title">Vario</span></h2>
      </div>
    </div>

    <div class="header-right">
      <button id="btnStart" class="btn-start btn-toggleable">Marche / Arrêt</button>
    </div>
  </header>

  <main class="dashboard-grid">

    <!-- ENCADRÉ PRINCIPAL (Occupant 100% de la hauteur et du reste en X, sans texte Vz) -->
    <div class="card box-center">
      <div class="visual-display">
        <div class="vario-stack">
          <img id="varioBackgroundImg" src="Images/fondnoirvario.png" alt="Fond Vario" class="vario-bg">
          
          <div class="vario-content">
            <img id="varioStateImg" src="Images/coloriageVz.png" alt="État Vario" class="vario-fg">
            <img id="varioNeedleImg" src="Images/Aiguille.png" alt="Aiguille" class="vario-needle">
          </div>
        </div>
      </div>
    </div>

    <!-- ENCADRÉ 1 : Haut Gauche (Fuschia) -->
<div class="card box-outer box-top-left card-reglages">
  <h3>Vario, mixage</h3>

  <div class="slider-container">
    <label for="gainCadence">Cadence :</label>
    <input type="range" id="gainCadence" min="50" max="500" step="10" value="100">
    <span id="txtCadence">100 ms</span>
  </div>

  <div class="slider-container">
    <label for="gainPartage" class="label-partage">
      <span class="label-pression">hPa</span>
    </label>
    <input type="range" id="gainPartage" class="slider-partage" min="0" max="100" step="1" value="50">
    <span class="label-accel">Vz</span>
    <span id="txtPartage">50/50</span>
  </div>

  <div class="slider-container">
    <label for="tailleVario">Taille Vario :</label>
    <input type="range" id="tailleVario" min="50" max="200" step="5" value="100">
    <span id="txtTailleVario">100%</span>
  </div>

  <div class="slider-container">
    <label for="amplitudeAiguille">Amplitude aiguille :</label>
    <input type="range" id="amplitudeAiguille" min="10" max="60" step="1" value="30">
    <span id="txtAmplitudeAiguille">30</span>
  </div>
</div>

    <!-- ENCADRÉ 2 : Haut Droite (Bleu) -->
    <div class="card box-outer box-top-right card-audio">
      <h3>Audio</h3>
      <div class="slider-container">
        <label for="gainVolume">Volume :</label>
        <input type="range" id="gainVolume" min="0" max="100" step="1" value="80">
        <span id="txtVolume">80%</span>
      </div>

      <div class="slider-container">
        <label for="seuilMonte">Seuil monte :</label>
        <input type="range" id="seuilMonte" min="0" max="5" step="0.1" value="0">
        <span id="txtSeuilMonte">0.0 m/s</span>
      </div>

      <div class="slider-container">
        <label for="seuilBaisse">Seuil baisse :</label>
        <input type="range" id="seuilBaisse" min="0" max="5" step="0.1" value="0">
        <span id="txtSeuilBaisse">0.0 m/s</span>
      </div>
<div class="audio-test">
  <button id="btnTestMonte" type="button" class="btn-audio-test" aria-label="Tester le son de montée">
    <img src="Images/sonverslehaut.png" alt="Montée">
  </button>

  <button id="btnTestBaisse" type="button" class="btn-audio-test" aria-label="Tester le son de descente">
    <img src="Images/sonverslebas.png" alt="Descente">
  </button>
</div>
    </div>

    <!-- ENCADRÉ 3 : Bas Gauche (Vert) -->
    <div class="card box-outer box-bottom-left card-baro sensor-block block-pressure">
      <h3>Baromètre</h3>
      <div class="slider-container">
        <label for="gainPressure" class="sensor-label-pressure">Sensibilité :</label>
        <input type="range" id="gainPressure" min="0.1" max="2.0" step="0.1" value="1.0">
        <span id="txtGainPressure">1.0x</span>
      </div>
      <div class="chart-container-small">
        <canvas id="pressureChart"></canvas>
      </div>
    </div>

    <!-- ENCADRÉ 4 : Bas Droite (Orange) -->
    <div class="card box-outer box-bottom-right card-accel sensor-block block-accel">
      <h3>Accéléromètre</h3>
      <div class="slider-container">
        <label for="gainAccel" class="sensor-label-accel">Sensibilité :</label>
        <input type="range" id="gainAccel" min="0.1" max="2.0" step="0.1" value="1.0">
        <span id="txtGainAccel">1.0x</span>
      </div>
      <div class="chart-container-small">
        <canvas id="accelChart"></canvas>
      </div>
    </div>

  </main>

  <script src="Script.js" defer></script>
</body>
</html>
