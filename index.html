<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Vario</title>

  <!-- PWA & Mobile settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- Style CSS basique & Responsive -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
    }

    header {
      margin-bottom: 15px;
    }

    .btn-start {
      background-color: #00e676;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .btn-start:active {
      background-color: #00b359;
    }

    .sensor-data {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
    }

    .data-card {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
      min-width: 30%;
    }

    .data-value {
      font-size: 20px;
      font-weight: bold;
      color: #00e676;
    }

    .chart-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
  </style>

  <!-- Inclusion de Chart.js local -->
  <script src="chart.min.js"></script>
</head>
<body>

  <header>
    <h1>SuperVario</h1>
  </header>

  <main>
    <!-- Bouton indispensable pour activer les capteurs sur mobile -->
    <button id="btnStart" class="btn-start">Démarrer le Vario</button>

    <div class="sensor-data">
      <div class="data-card">
        <div>Altitude</div>
        <div id="valAltitude" class="data-value">-- m</div>
      </div>
      <div class="data-card">
        <div>Vitesse</div>
        <div id="valSpeed" class="data-value">-- km/h</div>
      </div>
      <div class="data-card">
        <div>Pression</div>
        <div id="valPressure" class="data-value">-- hPa</div>
      </div>
    </div>

    <!-- Conteneur du graphique -->
    <div class="chart-container">
      <canvas id="varioChart"></canvas>
    </div>
  </main>

  <script>
    // --- 1. Initialisation de Chart.js ---
    const ctx = document.getElementById('varioChart').getContext('2d');
    const varioChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Altitude (m)',
          data: [],
          borderColor: '#00e676',
          borderWidth: 2,
          fill: false
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: { display: false },
          y: {
            grid: { color: '#333' },
            ticks: { color: '#fff' }
          }
        }
      }
    });

    // --- 2. Fonction GPS ---
    function demarrerGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            const alt = position.coords.altitude !== null ? Math.round(position.coords.altitude) : '--';
            const speed = position.coords.speed !== null ? (position.coords.speed * 3.6).toFixed(1) : '--';

            document.getElementById('valAltitude').textContent = alt + ' m';
            document.getElementById('valSpeed').textContent = speed + ' km/h';

            // Mise à jour du graphique
            if (alt !== '--') {
              const now = new Date().toLocaleTimeString();
              varioChart.data.labels.push(now);
              varioChart.data.datasets[0].data.push(alt);

              // Conserver uniquement les 20 dernières mesures
              if (varioChart.data.labels.length > 20) {
                varioChart.data.labels.shift();
                varioChart.data.datasets[0].data.shift();
              }
              varioChart.update();
            }
          },
          (err) => console.error("Erreur GPS :", err.message),
          { enableHighAccuracy: true, maximumAge: 0 }
        );
      }
    }

    // --- 3. Fonction Baromètre ---
    function demarrerBarometre() {
      if ('PressureObserver' in window) {
        try {
          const observer = new PressureObserver((records) => {
            const record = records[records.length - 1];
            document.getElementById('valPressure').textContent = Math.round(record.pressure) + ' hPa';
          });
          observer.observe('cpu');
        } catch (e) {
          console.error("Erreur Baromètre :", e);
        }
      }
    }

    // --- 4. Écouteur sur le bouton Démarrer ---
    document.getElementById('btnStart').addEventListener('click', () => {
      demarrerGPS();
      demarrerBarometre();
      document.getElementById('btnStart').style.display = 'none'; // Masquer le bouton une fois lancé
    });

    // --- 5. Enregistrement du Service Worker PWA ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker enregistré !', reg.scope))
          .catch(err => console.error('Erreur Service Worker :', err));
      });
    }
  </script>
</body>
</html>
